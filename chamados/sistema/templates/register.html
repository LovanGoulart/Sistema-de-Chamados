<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-dark d-flex justify-content-center align-items-center" style="height:100vh;">
<div class="card p-4 shadow" style="width:350px;">
<h3 class="text-center">📝 Cadastro</h3>
<form method="POST">
<input name="nome" class="form-control mb-2" placeholder="Nome completo">
<input name="email" class="form-control mb-2 {% if erro %}is-invalid{% endif %}" placeholder="Email">
<input name="senha" type="password" class="form-control mb-2" placeholder="Senha">

<select name="tipo" class="form-control mb-3" required>
    <option value="" disabled selected>Qual o seu setor?</option>
    <option value="TI">Departamento de informática</option>   
    <option value="Apoio">Serviço de apoio</option>
    <option value="Manutencao">Manutenção</option>
    <option value="Usuario">Outros</option>
</select>

{% if erro %}
<div class="alert alert-danger text-center">{{ erro }}</div>
{% endif %}

<button class="btn btn-success w-100">Cadastrar</button>
    <a href="/login" class="d-block text-center mt-2">Fazer login</a>
</form>
</div>
</body>
</html>
