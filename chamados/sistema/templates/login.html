<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-dark d-flex justify-content-center align-items-center" style="height:100vh;">
<div class="card p-4 shadow" style="width:350px;">
<h3 class="text-center">🔐 Login</h3>
<form method="POST">
<input name="email" class="form-control mb-2" placeholder="Email">
<input name="senha" type="password" class="form-control mb-2" placeholder="Senha">

{% if request.args.get('sucesso') %}
<div class="alert alert-success text-center">Cadastro realizado com sucesso!</div>
{% endif %}

<button class="btn btn-primary w-100">Entrar</button>
<a href="/register" class="d-block text-center mt-2">Criar conta</a>
</form>

</div>
</body>
</html>
