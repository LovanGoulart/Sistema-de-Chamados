<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <title>Resolver Chamado</title>
</head>
<body class="bg-light">
<div class="container mt-5">
<!---------------------------------------BARRA SUPERIOR----------------------------------------------------------->
<!-- NAVBAR PROFISSIONAL -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-pro shadow-sm fixed-top">
<div class="container-fluid">

<li class="nav-item">
<!--TELA INICIAL--->      
  <a href="/dashboard" class="btn btn-white btn-pro"><i class="bi bi-fill"></i>Início</a>
</li>

<!-- BOTÃO MOBILE -->
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
  <span class="navbar-toggler-icon"></span>
</button>

<!-- MENU -->
<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto align-items-center gap-2">

<!-- USUÁRIO -->
<li class="nav-item text-white me-3">
  <i class="bi bi-person me-1"></i>{{session['user']}}
</li>     

<!-- SAIR -->
<li class="nav-item">
  <a href="/logout" class="btn btn-danger btn-pro">
  <i class="bi bi-box-arrow-right"></i> Sair</a>
</li>
</ul>
</div>    
</div>  
</nav>
<!----------------------------------------------------------------------------------------------------------------->
<div class="card shadow p-4">

<h3>🛠️ Resolver Chamado</h3>

<p><strong>SOLICITANTE:</strong> {{chamado.solicitante}}</p>
<p><strong>LOCAL:</strong> {{chamado.local}}</p>
<p><strong>DESCRIÇÃO DO PROBLEMA:</strong> {{chamado.descricao}}</p>

<form method="POST">
<p><strong><label>DESCRIÇÃO DA SOLUÇÃO:</label></strong><p>
<textarea name="solucao" class="form-control mb-3" required></textarea>
<button class="btn btn-success w-100">✅ Finalizar Chamado</button>
</form>
</div>
</div>
<!-------------------------------------------------------------------RODAPÉ--------------------------------------------------------->
<footer class="footer-pro">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <span>© 2026 HelpDesk - Sistema de chamados</span>
        <span>Desenvolvido por TI • v1.0</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
